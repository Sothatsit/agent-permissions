name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Build
        run: ./dev-scripts/build.sh
      - name: Test
        run: ./test/test.sh
