name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Build
        run: ./build.sh
      - name: Test
        run: ./test/test.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          AGENT_PERMISSIONS_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          name="agent-permissions-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o "dist/$name" \
            ./cmd/agent-permissions
          (cd dist && tar czf "$name.tar.gz" "$name")
          (
            cd dist
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          )

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
